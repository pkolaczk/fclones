[package]
name         = "fclones"
version      = "0.35.0"
description  = "Finds and removes duplicate files"
authors      = ["Piotr Kołaczkowski <pkolaczk@gmail.com>"]
homepage     = "https://github.com/pkolaczk/fclones"
repository   = "https://github.com/pkolaczk/fclones"
categories   = ["filesystem", "command-line-utilities"]
keywords     = ["duplicate", "dupe", "finder", "search", "cleaner"]
license      = "MIT"
readme       = "README.md"
edition      = "2024"
exclude      = [".circleci", "release.sh"]
rust-version = "1.89"

[dependencies]
blake3 = { version = "1.3", optional = true }
byteorder = "1.5"
bytesize = "2.0"
byte-unit = "5.1"
chrono = { version = "0.4", default-features = false, features = [
    "serde",
    "clock",
    "std",
] }
clap = { version = "4", features = ["derive", "cargo", "wrap_help"] }
clap_complete = "4"
console = "0.16"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
csv = "1.1"
dashmap = "6.1"
dirs = "6.0"
dtparse = "2"
dunce = "1.0"
fallible-iterator = "0.3"
filetime = "0.2"
hex = "0.4"
ignore = "0.4.18"
indexmap = "2"
itertools = "0.14"
lazy-init = "0.5"
metrohash = "1.0"
nom = "8"
num_cpus = "1.13"
priority-queue = "2.5"
rand = "0.10"
rayon = "1.11"
regex = "1.11"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
sha3 = { version = "0.10", optional = true }
sled = "0.34"
smallvec = "1.8"
status-line = "0.2.0"
stfu8 = "0.2"
sysinfo = "0.38"
thread_local = "1.1"
typed-sled = "0.2.0"
uuid = { version = "1.1", features = ["v4"] }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }

[features]
default = ["blake3", "xxhash", "sha2", "sha3"]
xxhash  = ["xxhash-rust"]

[target.'cfg(target_os = "linux")'.dependencies]
fiemap = "0.2"

[target.'cfg(unix)'.dependencies]
file-owner = "0.1"
nix        = { version = "0.31", features = ["user", "fs", "ioctl"] }
xattr      = "1"

[target.'cfg(windows)'.dependencies]
winapi = "0.3"

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
reflink = "0.1"

[dev-dependencies]
assert_matches = "1.5"
reflink        = "0.1"
serde_test     = "1.0"
tempfile       = "3"
